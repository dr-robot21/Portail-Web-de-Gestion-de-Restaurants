services:
  - type: web
    name: restaurant-portal-api
    runtime: docker
    repo: https://github.com/dr-robot21/Portail-Web-de-Gestion-de-Restaurants.git
    branch: backend
    plan: free
    dockerContext: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: restaurant-portal-api
          type: web
          property: url
      - key: FRONTEND_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FILESYSTEM_DISK
        value: local
